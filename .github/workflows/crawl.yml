name: Nightly job crawl
on:
  schedule:
    - cron: "17 2 * * *"      # every night 02:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl
        run: python crawler/crawl.py --max 50 --detect 60
      - name: Commit results
        run: |
          git config user.name "career-atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ companies.csv
          git diff --cached --quiet || git commit -m "Nightly crawl $(date -u +%F)"
          git push
